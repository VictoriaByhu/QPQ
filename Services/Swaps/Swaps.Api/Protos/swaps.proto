syntax = "proto3";

option csharp_namespace = "Swaps.Grpc";

package swaps;

import "google/protobuf/timestamp.proto";

// Read access to swaps and the skills catalog for internal services.
service SwapsService {
  // Returns a swap card. The caller is taken from the x-user-id metadata.
  rpc GetSwap (GetSwapRequest) returns (SwapReply);

  // Returns the known skills among the requested ids; unknown ids are omitted.
  rpc GetSkillsByIds (GetSkillsByIdsRequest) returns (SkillsReply);
}

message GetSwapRequest {
  int32 id = 1;
}

message SwapReply {
  int32 id = 1;
  // GUID of the user who created the swap.
  string initiator_id = 2;
  // GUID of the second participant.
  string partner_id = 3;
  string status = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  // Base64 optimistic concurrency token.
  string row_version = 7;
  SwapDetailsReply details = 8;
  repeated SwapSkillReply skills = 9;
}

message SwapDetailsReply {
  optional string message = 1;
  optional string location = 2;
  google.protobuf.Timestamp proposed_date = 3;
  optional int32 duration_minutes = 4;
}

message SwapSkillReply {
  int32 skill_id = 1;
  string skill_name = 2;
  // Offered or Requested.
  string role = 3;
}

message GetSkillsByIdsRequest {
  repeated int32 ids = 1;
}

message SkillsReply {
  repeated SkillReply skills = 1;
}

message SkillReply {
  int32 id = 1;
  string name = 2;
}
