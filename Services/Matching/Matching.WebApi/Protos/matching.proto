syntax = "proto3";

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Matching.GrpcContracts";

package matching;

// Read model підбору пар для внутрішніх сервісів (Aggregator).
service MatchingService {
  // Статистика попиту й пропозиції за навичкою. Немає статистики -> NotFound, SkillId <= 0 -> InvalidArgument.
  rpc GetSkillStats (GetSkillStatsRequest) returns (SkillStatsReply);
}

message GetSkillStatsRequest {
  int32 skill_id = 1;
}

// Номери полів не змінюються після публікації контракту.
message SkillStatsReply {
  int32 skill_id = 1;
  string skill_name = 2;
  int32 offers_count = 3;
  int32 wants_count = 4;
  repeated LanguageCount top_languages = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message LanguageCount {
  string code = 1;
  int32 count = 2;
}
