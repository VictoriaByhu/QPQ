syntax = "proto3";
option csharp_namespace = "QPQ.Reviews.Grpc";
package reviews;

// Сервіс для внутрішньої комунікації
service ReviewsService {
  rpc GetReview (GetReviewRequest) returns (ReviewReply);
}

// Запит
message GetReviewRequest { 
  string id = 1; 
}

// Відповідь (можеш додати свої поля, якщо у тебе в DTO є ще якісь)
message ReviewReply {
  string id = 1;
  string text = 2;
  int32 rating = 3;
}